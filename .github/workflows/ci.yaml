---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: 🧪 Pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up UV
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: 🧪 Run tests
        run: uv run --group dev pytest

  lint-hadolint:
    name: 🐳 Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v7.0.1
      - name: 🧪 Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0

  build-test:
    name: 🛠 Build test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint-hadolint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v7.0.1
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          install: true
          driver: docker-container
      - name: 🧪 Build (no push)
        uses: docker/build-push-action@v7.3.0
        with:
          push: false
          build-args: PYTHON_VERSION=${{ matrix.python }}
